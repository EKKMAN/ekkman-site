<style>
  :root {
    --bg: #0a0c14;
    --card: #11141f;
    --line: #232838;
    --text: #f1ede8;
    --muted: #8d92a6;
    --egg: #f2b58c;
    --egg-soft: rgba(242, 181, 140, 0.14);
    --ease: cubic-bezier(.22, 1, .36, 1);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background-image: radial-gradient(ellipse 60% 50% at 50% 45%, rgba(242,181,140,0.07), transparent 70%);
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 28px;
    padding: 32px 30px 24px;
    text-align: center;
    animation: enter .8s var(--ease) both;
  }
  @keyframes enter {
    from { opacity: 0; transform: translateY(14px) scale(.98); }
    to   { opacity: 1; transform: none; }
  }
  .pfp {
    width: 96px; height: 96px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--egg);
    background: #000;
    display: block;
    margin: 0 auto 16px;
  }
  h1 { font-size: 2rem; font-weight: 700; letter-spacing: .04em; }

  .tabs {
    position: relative;
    display: inline-flex;
    margin: 18px 0 16px;
    padding: 5px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--bg);
  }
  .pill {
    position: absolute;
    top: 5px; bottom: 5px; left: 0;
    width: 0;
    border-radius: 999px;
    background: var(--egg-soft);
    border: 1px solid var(--egg);
    transition: transform .45s var(--ease), width .45s var(--ease);
    pointer-events: none;
  }
  .tab {
    position: relative;
    z-index: 1;
    font: inherit;
    font-weight: 500;
    color: var(--muted);
    background: none;
    border: 0;
    border-radius: 999px;
    padding: 8px 18px;
    cursor: pointer;
    transition: color .3s ease;
  }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { color: var(--text); }
  .tab:focus-visible, a:focus-visible { outline: 2px solid var(--egg); outline-offset: 2px; }

  /* panels stack in the same spot and cross-fade; height animates */
  .panels {
    position: relative;
    overflow: hidden;
    transition: height .45s var(--ease);
  }
  .panel {
    position: absolute;
    inset: 0 0 auto 0;
    opacity: 0;
    visibility: hidden;
    transform: translateY(6px);
    transition: opacity .35s ease, transform .45s var(--ease), visibility 0s linear .35s;
  }
  .panel.active {
    position: relative;
    opacity: 1;
    visibility: visible;
    transform: none;
    transition: opacity .4s ease .08s, transform .45s var(--ease) .08s, visibility 0s;
  }
  .about {
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    color: var(--muted);
    line-height: 1.5;
  }
  .list { display: grid; gap: 6px; text-align: left; }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 11px 15px;
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    transition: border-color .3s ease, background .3s ease, transform .3s var(--ease);
  }
  .row:hover { border-color: var(--egg); background: var(--egg-soft); }
  .row .name { display: flex; align-items: center; gap: 10px; }
  .row small { display: block; font-weight: 400; color: var(--muted); margin-top: 1px; font-size: .85rem; }
  .row > svg { flex: none; color: var(--muted); transition: color .3s ease, transform .3s var(--ease); }
  .row:hover > svg { color: var(--egg); transform: translate(1px, -1px); }
  footer { margin-top: 18px; color: var(--muted); font-size: .8rem; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>

<script>
  const tabs = [...document.querySelectorAll('.tab')];
  const pill = document.querySelector('.pill');
  const panels = document.querySelector('.panels');

  function movePill() {
    const t = tabs.find(x => x.getAttribute('aria-selected') === 'true');
    pill.style.width = t.offsetWidth + 'px';
    pill.style.transform = 'translateX(' + t.offsetLeft + 'px)';
  }
  function fitHeight() {
    const p = panels.querySelector('.panel.active');
    panels.style.height = p.offsetHeight + 'px';
  }
  function show(name) {
    tabs.forEach(t => t.setAttribute('aria-selected', t.id === 'tab-' + name));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + name));
    movePill();
    fitHeight();
  }
  tabs.forEach(t => t.addEventListener('click', () => show(t.id.replace('tab-', ''))));

  // set up without animating on first load
  pill.style.transition = 'none';
  panels.style.transition = 'none';
  movePill(); fitHeight();
  requestAnimationFrame(() => requestAnimationFrame(() => {
    pill.style.transition = '';
    panels.style.transition = '';
  }));
  window.addEventListener('resize', () => { movePill(); fitHeight(); });
  if (document.fonts) document.fonts.ready.then(() => { movePill(); fitHeight(); });
</script>
